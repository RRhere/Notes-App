{% extends "base.html" %}

{% block title %}Forgot Password - Notes App{% endblock %}

{% block content %}

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <i class="fas fa-key"></i>
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-subtitle">Enter your email to receive a verification code</p>
    </div>

    <form method="POST" id="forgotPasswordForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-4">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent">
            <i class="fas fa-envelope text-primary"></i>
          </span>
          <input
            type="email"
            class="form-control custom-input"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
            autocomplete="email"
          >
        </div>
      </div>

      <button type="submit" class="custom-btn w-100 btn-lg" id="submitBtn">
        <i class="fas fa-paper-plane me-2"></i>Send Verification Code
      </button>
    </form>

    <div class="auth-footer">
      <p class="mb-0">
        Remember your password?
        <a href="/login" class="text-decoration-none fw-bold">Login here</a>
      </p>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
  document.getElementById('forgotPasswordForm').addEventListener('submit', function () {
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending code...';
    setTimeout(() => {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Send Verification Code';
    }, 8000);
  });
</script>
{% endblock %}
