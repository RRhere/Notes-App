{% extends "base.html" %}

{% block title %}Server Error - Notes App{% endblock %}

{% block content %}

<div class="error-page">

    <h2 class="error-message">Internal Server Error</h2>

    </p>
    <a href="/" class="custom-btn">
        <i class="fas fa-home me-2"></i>
        Return to Home
    </a>
</div>

{% endblock %}
