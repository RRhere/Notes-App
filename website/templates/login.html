{% extends "base.html" %}

{% block title %}Login - Notes App{% endblock %}

{% block content %}

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <i class="fas fa-sign-in-alt"></i>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Login to access your notes</p>
    </div>

    <form method="POST" id="loginForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-4">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent">
            <i class="fas fa-envelope text-primary"></i>
          </span>
          <input
            type="email"
            class="form-control custom-input"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
            autocomplete="email"
          >
        </div>
        <small class="form-text text-muted">We'll never share your email</small>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent">
            <i class="fas fa-lock text-primary"></i>
          </span>
          <input
            type="password"
            class="form-control custom-input"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >
          <button class="btn password-toggle-btn"" type="button" id="togglePassword" title="Show password">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="d-flex justify-content-between mb-4 auth-links">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="remember" id="remember">
          <label class="form-check-label" for="remember">Remember me</label>
        </div>
        <a href="/forgot_password" class="text-decoration-none">Forgot Password?</a>
      </div>

      <button type="submit" class="custom-btn w-100 btn-lg" id="loginBtn">
        <i class="fas fa-sign-in-alt me-2"></i>Login
      </button>
    </form>

    <div class="auth-footer">
      <p class="mb-0">
        Don't have an account?
        <a href="/signup" class="text-decoration-none fw-bold">Create one here</a>
      </p>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
  document.getElementById('togglePassword').addEventListener('click', function () {
    const input = document.getElementById('password');
    const icon  = this.querySelector('i');
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    icon.classList.toggle('fa-eye',       !isHidden);
    icon.classList.toggle('fa-eye-slash',  isHidden);
  });

  document.getElementById('loginForm').addEventListener('submit', function () {
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';
    setTimeout(() => { btn.disabled = false; btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Login'; }, 8000);
  });
</script>
{% endblock %}
