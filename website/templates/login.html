{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <h1 class="auth-title">Welcome Back</h1>

        <p class="auth-subtitle">
            Login to continue to your notes
        </p>

        <form method="POST">

            <div class="mb-3">
                <input
                    type="email"
                    class="form-control custom-input"
                    id="email"
                    name="email"
                    placeholder="Email Address"
                    required
                >
            </div>

            <div class="mb-3">
                <input
                    type="password"
                    class="form-control custom-input"
                    id="password"
                    name="password"
                    placeholder="Password"
                    required
                >
            </div>

            <div class="d-flex justify-content-between mb-4 auth-links">

                <a href="/signup">
                    Create Account
                </a>

                <a href="/forgot_password">
                    Forgot Password?
                </a>

            </div>

            <button type="submit" class="custom-btn w-100">
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
